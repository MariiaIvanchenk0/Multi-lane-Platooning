/**:
  ros__parameters:
    R: 1.0                 # reference-path radius (metres) -- NOT a robot dimension
    frequency: 20.0
    center_x: 1.103482127188517
    center_y: 0.06993669405299056
    wheelbase: 0.23       # front-to-rear axle distance (L). Sets turning radius = L/tan(phi).

"/**/controller":
  ros__parameters:
    k_1: 3.0 # 3.0
    k_2: 0.3 # 0.3
    V_MAX: 1.0

    alpha: 0.01 # 0.0012
    beta: -1.0 # -0.0001
    delta: 0.0 # -0.1

    alpha_bar_hat: 100.0 # 83.33 # 1.0
    beta_hat: -1.0 # -0.0001
    delta_hat: 0.0 # -0.1

    gamma_alpha: 0.001
    gamma_beta: 0.0001
    gamma_delta: 0.01
    
    k_a1: 0.5
    k_a2: 0.5
    ki: 0.3
    PHI_MAX: 20.0
    l_lane: 0.0


"/**/formation_controller":
  ros__parameters:
    neighbor_id: [2]    # IDs of topological neighbors
    namespace: "robot"  # Must match omnisim/polytope_safety_net agent namespace
    
    k_s: 0.4 # 0.6
    k_l: 0.3
    k_n: 0.06           # Smooth deadzone design constant

    v_f: 0.7           # Desired cruise speed (m/s)
    n_bar: 0.03          # Bounded noise threshold (m)
